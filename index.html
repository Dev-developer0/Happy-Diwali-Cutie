<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Diwali</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,200;9..144,300&display=swap" rel="stylesheet">
<style>
:root{
  --night:#1a1428;
  --dusk:#2a1f3d;
  --flame:#f6b73c;
  --ember:#e8832a;
  --paper:#f4ece0;
  --mute:#9d92b0;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:var(--night);
  color:var(--paper);
  font-family:'Fraunces',Georgia,serif;
  font-weight:300;
  overflow:hidden;
}
.glow{
  position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% 62%,rgba(246,183,60,.28),rgba(232,131,42,.10) 28%,transparent 55%);
  opacity:0;transition:opacity 2.4s ease;
}
.lit .glow{opacity:1}
main{
  min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2.2rem;padding:2rem 1.5rem;text-align:center;position:relative;
}
h1{
  margin:0;font-weight:200;font-size:clamp(2.6rem,9vw,6rem);letter-spacing:-.02em;line-height:1;
  opacity:0;transform:translateY(8px);
  transition:opacity 1.8s ease .5s,transform 1.8s ease .5s;
}
.sub{
  margin:0;color:var(--mute);font-size:1.05rem;max-width:30ch;line-height:1.6;
  transition:opacity 1.2s ease;
}
.sub.after{opacity:0;transition:opacity 1.8s ease 1.2s}
.lit h1{opacity:1;transform:none}
.lit .sub.before{opacity:0}
.lit .sub.after{opacity:1}
.stage{display:grid;place-items:center;min-height:15rem;width:100%}
.stage>*{grid-area:1/1}
.copy{display:grid;place-items:center;min-height:5rem}
.copy>*{grid-area:1/1}
button.diya{
  all:unset;cursor:pointer;display:block;border-radius:50%;
  -webkit-tap-highlight-color:transparent;
}
button.diya:focus-visible{outline:2px solid var(--flame);outline-offset:10px}
svg{width:min(62vw,15rem);height:auto;overflow:visible;display:block}
.bowl{fill:var(--dusk);stroke:var(--mute);stroke-width:1.2}
.wick{fill:var(--paper)}
.flame{
  fill:var(--flame);transform-origin:100px 108px;transform:scale(0);
  transition:transform 1.1s cubic-bezier(.2,.8,.2,1);
  filter:drop-shadow(0 0 14px rgba(246,183,60,.9));
}
.core{fill:var(--paper);transform-origin:100px 108px;transform:scale(0);transition:transform 1.1s cubic-bezier(.2,.8,.2,1) .1s}
.lit .flame{transform:scale(1);animation:flicker 3.2s ease-in-out 1.2s infinite}
.lit .core{transform:scale(1);animation:flicker 2.6s ease-in-out 1.2s infinite}
@keyframes flicker{
  0%,100%{transform:scale(1) skewX(0)}
  30%{transform:scale(.96,1.04) skewX(-2deg)}
  55%{transform:scale(1.03,.97) skewX(1.5deg)}
  80%{transform:scale(.98,1.02) skewX(-1deg)}
}
footer{
  position:fixed;left:0;right:0;bottom:calc(1.4rem + env(safe-area-inset-bottom,0px));
  text-align:center;color:var(--mute);font-size:.9rem;letter-spacing:.04em;
}
@media (prefers-reduced-motion:reduce){
  .lit .flame,.lit .core{animation:none}
  *{transition-duration:.01s!important;transition-delay:0s!important}
}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<main>
  <div class="stage">
    <button class="diya" id="diya" aria-pressed="false" aria-label="Light the diya">
      <svg viewBox="0 0 200 150" aria-hidden="true">
        <path class="flame" d="M100 30 C112 54 122 70 122 88 C122 102 112 110 100 110 C88 110 78 102 78 88 C78 70 90 54 100 30 Z"/>
        <path class="core" d="M100 66 C106 78 110 86 110 94 C110 102 105 107 100 107 C95 107 90 102 90 94 C90 86 94 78 100 66 Z"/>
        <rect class="wick" x="98" y="104" width="4" height="10" rx="2"/>
        <path class="bowl" d="M24 112 C24 132 56 144 100 144 C144 144 176 132 176 112 C150 120 126 118 100 118 C74 118 50 120 24 112 Z"/>
      </svg>
    </button>
  </div>
  <div class="copy" aria-live="polite">
    <p class="sub before">Tap the diya to light it.</p>
    <div class="sub after"><h1>Happy Diwali</h1></div>
  </div>
</main>
<footer>By Dev</footer>
<script>
(function(){
  var b=document.getElementById('diya');
  function toggle(){
    var on=document.body.classList.toggle('lit');
    b.setAttribute('aria-pressed',on);
    b.setAttribute('aria-label',on?'Put out the diya':'Light the diya');
  }
  b.addEventListener('click',toggle);
})();
</script>
</body>
</html>
